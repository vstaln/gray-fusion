[package]
name = "gray-fusion"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Gray Fusion plugin: lead + persistent sidekick orchestration"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
